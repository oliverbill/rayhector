<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fagulho: Lendas do Bosque</title>
<style>
  /* position:fixed no html/body é o que segura o Safari do iOS: sem isso a
     página balança (rubber-band) a cada toque e a barra de endereço entra e
     sai no meio do jogo. touch-action/user-select matam o zoom por duplo
     toque e a lupa de seleção de texto sobre o canvas. */
  html, body {
    margin: 0; padding: 0;
    position: fixed; inset: 0; width: 100%; height: 100%;
    background: #120a1e; overflow: hidden; overscroll-behavior: none;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block; background: #1a0f2e;
    box-shadow: 0 0 60px rgba(255, 150, 40, 0.15);
    image-rendering: auto;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script src="assets.js"></script>
<script src="audio.js"></script>
<!-- levelkit antes das fases (elas o usam para construir a geometria no load);
     as fases entram em FG.levels nesta ordem, e é ela que define a sequência -->
<script src="levelkit.js"></script>
<script src="level.js"></script>
<script src="level2.js"></script>
<script src="level3.js"></script>
<script src="obstacles.js"></script>
<script src="player.js"></script>
<!-- enemies antes dos chefões: é ele que expõe o registerBoss -->
<script src="enemies.js"></script>
<script src="boss1.js"></script>
<script src="boss2.js"></script>
<script src="boss3.js"></script>
<script src="engine.js"></script>
<!-- touch depois do engine: usa FG.engine.setAction/gesture, e o engine só o
     procura em runtime (FG.touch pode não existir) -->
<script src="touch.js"></script>
</body>
</html>
